
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bashar Alzaq - My Profile</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="profile-card">

        <div class="top-controls">
            <button id="language-button" type="button">
                العربية
            </button>
        </div>

        <h1 data-i18n="title">My Profile</h1>

        <img
            id="profile-photo"
            src="assets/profile-professional.jpg"
            alt="Bashar Alzaq's professional profile photo"
        >

        <h2 data-i18n="name">Bashar Alzaq</h2>

        <p id="photo-description" data-i18n="professional">
            Professional Photo
        </p>

        <button id="switch-photo" type="button" data-i18n="switchPhoto">
            Switch Photo
        </button>

    </main>

</body>
</html>
